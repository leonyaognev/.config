#--- НАСТРОЙКА МОНИТОРОВ ------------------------------------------------------
monitor=HDMI-A-1,1920x1080@60.00,auto,0.7
monitor=eDP-1,1920x1200@165,0x0,1

#--- ПОДКЛЮЧЕНИЕ ДОПОЛНИТЕЛЬНЫХ ФАЙЛОВ С КОНФИГОМ  ----------------------------
source = ~/.cache/cwal/colors-hyprland.conf

#--- АВТОСТАРТ ДЕМОНОВ --------------------------------------------------------
exec-once = awww-daemon
exec-once = quickshell
exec-once = swaync
exec-once = waybar -c ~/.config/waybar/config -s ~/.config/waybar/style.css
exec-once = wl-clip-persist --clipboard regular --display wayland-1


#--- АВТОСТАРТ ПРИЛОЖЕНИЙ -----------------------------------------------------
exec-once = [workspace 1] zen-browser
exec-once = [workspace 2] kitty
exec-once = [workspace 3] Telegram
exec-once = [workspace 4] kitty spotify_player

misc:vrr = true
misc:disable_splash_rendering = true

#--- РАЗМЕР КУРСОРА ЧЕРЕЗ ПЕРЕМЕННУЮ ------------------------------------------
env = XCURSOR_THEME, Bibata-Modern-Classic
env = XCURSOR_SIZE, 30
env = GDK_SCALE, 1.5


#--- РАСКЛАДКА КЛАВИАТУРЫ -----------------------------------------------------
input {
    kb_layout = us,ru
    kb_options = grp:win_space_toggle, caps:escape

    follow_mouse = 1

    touchpad {
        natural_scroll = true
        drag_lock = false

    }
    sensitivity = 0.7
}

#--- ГАПСЫ, БОРДЕРЫ, ЦВЕТА... -------------------------------------------------
general {
    gaps_in = 3
    gaps_out = 6
    border_size = 2
    col.active_border = $color4 $color6 45deg
    col.inactive_border = $color0

    layout = dwindle
}

decoration {
    blur {
        enabled = true
        size = 5
        passes = 2
        vibrancy = 0.4
        ignore_opacity = true
    }

    rounding = 20
    shadow {
      enabled = true
      range = 5
      render_power = 3
      color = rgba(0,0,0,0.2)
    }
    active_opacity = 1.0
    inactive_opacity = 0.9
}

#--- АНИМАЦИИ -----------------------------------------------------------------
animations {
    enabled = yes

    bezier = ease, 0.25, 0.1, 0.25, 1.0
    bezier = overshot, 0.13, 0.99, 0.29, 1.05

    animation = windows, 1, 5,  overshot, gnomed
    animation = windowsOut, 1, 5, ease, slide bottom
    animation = windowsMove, 1, 5, overshot, slide

    animation = layers, 1, 5, ease, gnomed
    animation = fade, 1, 3, ease
    animation = border, 1, 2, ease
    animation = workspaces, 1, 5, overshot, slide
} 

#--- НАСТРОЙКА ЛАЙОУТОВ -------------------------------------------------------
dwindle {
    preserve_split = true
}

#--- ЖЕСТЫ --------------------------------------------------------------------
gestures {
    gesture = 3, horizontal, workspace
    workspace_swipe_distance = 1000
    workspace_swipe_forever = true
}

#--- КЛАВИША МОДИФИКАТОР ------------------------------------------------------
$mainMod = SUPER


#--- ЗАПУСК ПРИЛОЖЕНИЙ --------------------------------------------------------
bind = $mainMod, RETURN, exec, kitty
bind = $mainMod, P, exec, hyprpicker --autocopy
bind = $mainMod, D, exec, rofi -show drun
bind = $mainMod, S, exec, swaync-client -t
bind = $mainMod, W, exec, ~/bin/wallpaper
bind = $mainMod, R, exec, ~/bin/wallpaper "$(rofi -show files -modes "files:~/bin/not_terminal_utils/rofi_wallpaper" -show-icons -theme .config/rofi/config_wallpaper.rasi 2>&1)"
bind = $mainMod SHIFT, W, exec, ~/bin/wifimenu
bind = $mainMod SHIFT, T, exec, Telegram
bind = $mainMod SHIFT, F, exec, zen-browser
bind = $mainMod SHIFT, G, exec, steam
bind = $mainMod SHIFT, M, exec, kitty spotify_player
bind = $mainMod SHIFT, D, exec, discord
bind = $mainMod SHIFT, P, exec, pavucontrol
bind = $mainMod SHIFT, B, exec, blueman-manager
bind = $mainMod SHIFT, V, exec, obsidian
bind = $mainMod SHIFT, W, exec, sh ~/bin/wifi
bind = $mainMod SHIFT, O, exec, hyprlock
bind = $mainMod SHIFT, C, exec, catgirldownloader


#--- ХОТКЕИ -------------------------------------------------------------------
bind = CTRL SHIFT, Q, exit,
bind = $mainMod, C, killactive,
bind = $mainMod, F, fullscreen,
bind = $mainMod, T, layoutmsg, togglesplit
bind = $mainMod, G, layoutmsg, swapsplit
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | swappy -f -
bind = $mainMod, V, togglefloating
bind = $mainMod, V, resizeactive, exact 1100 800
bind = $mainMod, P, pin

bind = $mainMod , B, exec, hyprctl keyword general:layout dwindle
bind = $mainMod , M, exec, hyprctl keyword general:layout master
bind = $mainMod , N, exec, hyprctl keyword general:layout scrolling


bind = $mainMod CTRL, P, exec, poweroff
bind = $mainMod CTRL, R, exec, reboot

#--- ПЕРЕКЛЮЧЕНИЕ ФОКУСА ------------------------------------------------------
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d


#--- ПЕРЕКЛЮЧЕНИЕ ВОРКСПЕЙСОВ -------------------------------------------------
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10


#--- ПЕРЕМЕЩЕНИЕ ОКОН НА ДРУГОЙ ВОРКСПЕЙС -------------------------------------
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10


#--- ПЕРЕХОД ПО ВОРКСПЕЙСАМ КОЛЕСОМ МЫШИ --------------------------------------
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1


#--- ПЕРЕМЕЩЕНИЕ И РЕСАЙЗ ОКОН МЫШЬЮ ------------------------------------------
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow


#--- РЕСАЙЗ -------------------------------------------------------------------
bind = $mainMod CTRL, h, resizeactive,-50 0
bind = $mainMod CTRL, l, resizeactive,50 0
bind = $mainMod CTRL, k, resizeactive,0 -50
bind = $mainMod CTRL, j, resizeactive,0 50

bind = SUPER SHIFT, H, moveactive, -50 0
bind = SUPER SHIFT, L, moveactive, 50 0
bind = SUPER SHIFT, K, moveactive, 0 -50
bind = SUPER SHIFT, J, moveactive, 0 50

bind = SUPER SHIFT, H, swapwindow, l
bind = SUPER SHIFT, L, swapwindow, r
bind = SUPER SHIFT, K, swapwindow, u
bind = SUPER SHIFT, J, swapwindow, d
